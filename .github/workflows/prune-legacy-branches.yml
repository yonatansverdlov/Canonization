name: One-time cleanup of legacy fix branches

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/prune-legacy-branches.yml

permissions:
  contents: write

jobs:
  keep-only-main:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete exactly the two obsolete fix branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for branch in fix/dws-mnist-source-detection fix/dws-source-discovery; do
            if gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}" >/dev/null 2>&1; then
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
              echo "Deleted: ${branch}"
            else
              echo "Not present: ${branch}"
            fi
          done
          branches="$(gh api "repos/${GITHUB_REPOSITORY}/branches" --jq '.[].name')"
          printf 'Remaining branches:\n%s\n' "${branches}"
          test "${branches}" = main
